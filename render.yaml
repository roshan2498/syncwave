# Render Blueprint — one free web service
services:
  - type: web
    name: syncwave
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: YOUTUBE_API_KEY
        sync: false
